</head>
<body class="bg-gray-50 text-gray-900 flex h-screen overflow-hidden antialiased">

    <div class="px-5 py-4 border-t border-white/10 text-xs text-gray-600 tracking-wide">
      v1.0 — Prototype
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto">

    <!-- Top Bar -->
    <header class="bg-white border-b border-gray-100 px-8 py-3.5 flex items-center justify-between sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <div>
          <h1 class="text-sm font-semibold text-gray-900 leading-tight">Fleet Overview</h1>
          <p id="headerDate" class="text-xs text-gray-400 leading-tight mt-0.5"></p>
        </div>
      </div>
      <div class="relative w-72">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 111 11a6 6 0 0116 0z"/></svg>
        <input
          id="searchInput"
          type="text"
          placeholder="Search by ID, location, type, or status…"
          class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-9 pr-3 py-1.5 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
          oninput="filterTable()"
        />
      </div>
    </header>

    <div class="px-8 py-6 space-y-5">

      <!-- Summary Cards -->
      <div class="grid grid-cols-3 gap-4">

        <!-- Total Elevators — spans 2 rows -->
        <div id="card-all" onclick="selectCard('all')" class="cursor-pointer rounded-xl border border-blue-400 shadow-sm p-6 bg-blue-500 row-span-2 flex flex-col justify-between transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-all" class="text-xs font-semibold uppercase tracking-wide text-white/70">Total Elevators</p>
            <svg id="icon-all" class="w-5 h-5 text-white/60" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0H5m14 0h2M5 21H3M9 7h1m-1 4h1m4-4h1m-1 4h1M9 21v-4a2 2 0 012-2h2a2 2 0 012 2v4"/></svg>
          </div>
          <div>
            <p id="count-all" class="text-5xl font-bold tracking-tight text-white mt-2"></p>
            <p id="sub-all" class="text-xs text-white/50 mt-2 leading-relaxed"></p>
          </div>
        </div>

        <!-- Row 1 -->
        <div id="card-active" onclick="selectCard('active')" class="cursor-pointer rounded-xl border border-gray-100 shadow-sm p-5 bg-white transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-active" class="text-xs font-semibold uppercase tracking-wide text-gray-400">Active</p>
            <svg id="icon-active" class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <p id="count-active" class="text-3xl font-bold tracking-tight text-green-600 mt-3"></p>
          <p id="sub-active" class="text-xs text-gray-400 mt-1.5 leading-relaxed"></p>
        </div>

        <div id="card-inactive" onclick="selectCard('inactive')" class="cursor-pointer rounded-xl border border-gray-100 shadow-sm p-5 bg-white transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-inactive" class="text-xs font-semibold uppercase tracking-wide text-gray-400">Non-Active</p>
            <svg id="icon-inactive" class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <p id="count-inactive" class="text-3xl font-bold tracking-tight text-orange-500 mt-3"></p>
          <p id="sub-inactive" class="text-xs text-gray-400 mt-1.5 leading-relaxed"></p>
        </div>

        <!-- Row 2 -->
        <div id="card-overdue" onclick="selectCard('overdue')" class="cursor-pointer rounded-xl border border-gray-100 shadow-sm p-5 bg-white transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-overdue" class="text-xs font-semibold uppercase tracking-wide text-gray-400">Overdue Inspections</p>
            <svg id="icon-overdue" class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <p id="count-overdue" class="text-3xl font-bold tracking-tight text-red-600 mt-3"></p>
          <p id="sub-overdue" class="text-xs text-gray-400 mt-1.5 leading-relaxed"></p>
        </div>

        <div id="card-expired" onclick="selectCard('expired')" class="cursor-pointer rounded-xl border border-gray-100 shadow-sm p-5 bg-white transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-expired" class="text-xs font-semibold uppercase tracking-wide text-gray-400">Expired Licences</p>
            <svg id="icon-expired" class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
          </div>
          <p id="count-expired" class="text-3xl font-bold tracking-tight text-purple-600 mt-3"></p>
          <p id="sub-expired" class="text-xs text-gray-400 mt-1.5 leading-relaxed"></p>
        </div>

      </div>

      <!-- Table Section -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100">

        <div class="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2.5">
            <h2 class="text-sm font-semibold text-gray-900">Elevator Details</h2>
            <span id="resultsCount" class="text-xs text-gray-400"></span>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex rounded-lg border border-gray-200 overflow-hidden">
              <button id="btn-az" onclick="setSortBtn('az')" class="px-3 py-1.5 text-xs text-gray-500 hover:bg-gray-50 transition-colors duration-100">↑</button>
              <button id="btn-za" onclick="setSortBtn('za')" class="px-3 py-1.5 text-xs text-gray-500 border-l border-gray-200 hover:bg-gray-50 transition-colors duration-100">↓</button>
            </div>
            <select id="sortSelect" onchange="resetSortBtns(); applyFilters()" class="border border-gray-200 rounded-lg px-3 py-1.5 text-xs text-gray-600 bg-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
              <option value="">Sort by…</option>
              <option value="id">Elevator ID</option>
              <option value="location">Location</option>
              <option value="type">Type</option>
              <option value="status">Status</option>
              <option value="licenseExpiry">License Expiry</option>
              <option value="lastInspection">Last Inspection</option>
            </select>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full" id="elevatorTable">
            <thead>
              <tr class="border-b border-gray-100">
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">Elevator ID</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">Location</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">Type</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">Status</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">License Expiry</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">Last Inspection</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-50">
            </tbody>
          </table>
        </div>

        <div id="noResults" class="hidden px-5 py-10 text-center text-sm text-gray-400">
          No elevators match your search.
        </div>

      </div>
    </div>
  </main>

  <script>
    const elevators = [
      { id: 1001, location: "200 Bay St, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2026-11-30", lastInspection: "2025-10-14" },
      { id: 1002, location: "200 Bay St, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2026-11-30", lastInspection: "2025-10-14" },
      { id: 1003, location: "55 King St W, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2027-03-15", lastInspection: "2026-02-20" },
      { id: 1004, location: "55 King St W, Toronto, ON", type: "Freight Elevator", status: "Active", licenseExpiry: "2027-03-15", lastInspection: "2026-01-08" },
      { id: 1005, location: "1 Yonge St, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2026-08-01", lastInspection: "2025-07-22" },
      { id: 1006, location: "1 Yonge St, Toronto, ON", type: "Passenger Elevator", status: "Inactive", licenseExpiry: "2024-08-01", lastInspection: "2023-06-10" },
      { id: 1007, location: "333 King St E, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2026-12-01", lastInspection: "2025-11-03" },
      { id: 1008, location: "333 King St E, Toronto, ON", type: "Freight Elevator", status: "Active", licenseExpiry: "2026-12-01", lastInspection: "2024-09-18" },
      { id: 1009, location: "100 Queen St W, Toronto, ON", type: "Passenger Elevator", status: "TSSA Shutdown", licenseExpiry: "2025-05-20", lastInspection: "2024-04-30" },
      { id: 1010, location: "100 Queen St W, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2027-05-20", lastInspection: "2026-04-11" },
      { id: 1011, location: "4 Robert Speck Pkwy, Mississauga, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2027-01-10", lastInspection: "2025-12-02" },
      { id: 1012, location: "4 Robert Speck Pkwy, Mississauga, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2027-01-10", lastInspection: "2025-12-02" },
      { id: 1013, location: "77 City Centre Dr, Mississauga, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2026-09-14", lastInspection: "2025-08-30" },
      { id: 1014, location: "77 City Centre Dr, Mississauga, ON", type: "LULA Elevator", status: "Active", licenseExpiry: "2026-09-14", lastInspection: "2024-03-05" },
      { id: 1015, location: "20 Dundas St W, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2026-06-30", lastInspection: "2025-06-01" },
      { id: 1016, location: "20 Dundas St W, Toronto, ON", type: "Freight Elevator", status: "Customer Shutdown", licenseExpiry: "2025-06-30", lastInspection: "2024-05-14" },
      { id: 1017, location: "3300 Bloor St W, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2027-02-28", lastInspection: "2026-02-01" },
      { id: 1018, location: "3300 Bloor St W, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2027-02-28", lastInspection: "2026-02-01" },
      { id: 1019, location: "5045 Orbitor Dr, Mississauga, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2026-10-05", lastInspection: "2025-09-20" },
      { id: 1020, location: "5045 Orbitor Dr, Mississauga, ON", type: "Observation Elevator", status: "Active", licenseExpiry: "2026-10-05", lastInspection: "2025-09-20" },
      { id: 1021, location: "2 Gibbs Rd, Etobicoke, ON", type: "Passenger Elevator", status: "Inactive", licenseExpiry: "2023-11-01", lastInspection: "2022-10-17" },
      { id: 1022, location: "2 Gibbs Rd, Etobicoke, ON", type: "Freight Elevator", status: "Active", licenseExpiry: "2026-07-19", lastInspection: "2025-07-01" },
      { id: 1023, location: "700 Lawrence Ave W, Toronto, ON", type: "Passenger Elevator", status: "Active", licenseExpiry: "2027-04-22", lastInspection: "2026-03-30" },
      { id: 1024, location: "700 Lawrence Ave W, Toronto, ON", type: "Passenger Elevator", status: "Undergoing Major Alt", licenseExpiry: "2027-04-22", lastInspection: "2025-04-10" },
    ];

    const statusColors = {
      "Active":               "bg-green-50 text-green-700 ring-1 ring-green-200",
      "Inactive":             "bg-gray-100 text-gray-500 ring-1 ring-gray-200",
      "TSSA Shutdown":        "bg-red-50 text-red-700 ring-1 ring-red-200",
      "Customer Shutdown":    "bg-orange-50 text-orange-700 ring-1 ring-orange-200",
      "Undergoing Major Alt": "bg-yellow-50 text-yellow-700 ring-1 ring-yellow-200",
    };

    const cardDefaults = {
      "card-all":      { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-gray-900",   icon: "text-gray-400",   bg: "bg-white border-gray-100" },
      "card-active":   { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-green-600",  icon: "text-green-400",  bg: "bg-white border-gray-100" },
      "card-inactive": { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-orange-500", icon: "text-orange-400", bg: "bg-white border-gray-100" },
      "card-overdue":  { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-red-600",    icon: "text-red-400",    bg: "bg-white border-gray-100" },
      "card-expired":  { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-purple-600", icon: "text-purple-400", bg: "bg-white border-gray-100" },
    };

    const cardFilters = ["card-all", "card-active", "card-inactive", "card-overdue", "card-expired"];

    let activeSortBtn = null;

    function setSortBtn(btn) {
      activeSortBtn = activeSortBtn === btn ? null : btn;
      paintSortBtns();
      applyFilters();
    }

    function resetSortBtns() {
      activeSortBtn = null;
      paintSortBtns();
    }

    function paintSortBtns() {
      ["az", "za"].forEach(b => {
        const el = document.getElementById(`btn-${b}`);
        const border = b === "za" ? " border-l border-gray-200" : "";
        if (b === activeSortBtn) {
          el.className = `px-3 py-1.5 text-xs bg-gray-800 text-white transition-colors duration-100${border}`;
        } else {
          el.className = `px-3 py-1.5 text-xs text-gray-500 hover:bg-gray-50 transition-colors duration-100${border}`;
        }
      });
    }

    function subData(subset) {
      const operational    = subset.filter(e => e.status === "Active").length;
      const nonOperational = subset.length - operational;
      return `${operational} Operational · ${nonOperational} Non-Operational`;
    }

    function nonActiveSubData(subset) {
      const counts = {};
      subset.forEach(e => { counts[e.status] = (counts[e.status] || 0) + 1; });
      return Object.entries(counts).map(([s, n]) => `${n} ${s}`).join(' · ');
    }

    let activeFilter = "all";

    function isOverdue(lastInspection) {
      const cutoff = new Date();
      cutoff.setFullYear(cutoff.getFullYear() - 1);
      return new Date(lastInspection) < cutoff;
    }

    function selectCard(filter) {
      activeFilter = filter;

      cardFilters.forEach(id => {
        const key     = id.replace("card-", "");
        const card    = document.getElementById(id);
        const labelEl = document.getElementById(`label-${key}`);
        const countEl = document.getElementById(`count-${key}`);
        const iconEl  = document.getElementById(`icon-${key}`);
        const subEl   = document.getElementById(`sub-${key}`);
        const def     = cardDefaults[id];
        const isSelected = id === `card-${filter}`;

        const isTotal    = id === "card-all";
        const extraClass = isTotal ? " row-span-2 flex flex-col justify-between" : "";
        const countSize  = isTotal ? "text-5xl" : "text-3xl";
        const subMt      = isTotal ? "mt-2" : "mt-1.5";

        if (isSelected) {
          card.className    = `cursor-pointer rounded-xl border border-blue-400 shadow-sm p-${isTotal ? "6" : "5"} bg-blue-500${extraClass} transition-all duration-150 hover:shadow-md`;
          labelEl.className = "text-xs font-semibold uppercase tracking-wide text-white/70";
          countEl.className = `${countSize} font-bold tracking-tight text-white mt-3`;
          iconEl.className  = "w-5 h-5 text-white/60";
          if (subEl) subEl.className = `text-xs text-white/50 ${subMt} leading-relaxed`;
        } else {
          card.className    = `cursor-pointer rounded-xl border border-gray-100 shadow-sm p-${isTotal ? "6" : "5"} bg-white${extraClass} transition-all duration-150 hover:shadow-md`;
          labelEl.className = def.label;
          countEl.className = `${countSize} font-bold tracking-tight ${def.number} mt-3`;
          iconEl.className  = `w-${isTotal ? "5" : "4"} h-${isTotal ? "5" : "4"} ${def.icon}`;
          if (subEl) subEl.className = `text-xs text-gray-400 ${subMt} leading-relaxed`;
        }
      });

      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      let filtered = elevators;

      if (activeFilter === "active") {
        filtered = filtered.filter(e => e.status === "Active");
      } else if (activeFilter === "inactive") {
        filtered = filtered.filter(e => e.status !== "Active");
      } else if (activeFilter === "overdue") {
        filtered = filtered.filter(e => isOverdue(e.lastInspection));
      } else if (activeFilter === "expired") {
        filtered = filtered.filter(e => new Date(e.licenseExpiry) < new Date());
      }

      if (query) {
        filtered = filtered.filter(e =>
          String(e.id).includes(query) ||
          e.location.toLowerCase().includes(query) ||
          e.type.toLowerCase().includes(query) ||
          e.status.toLowerCase().includes(query)
        );
      }

      const field = document.getElementById("sortSelect").value;
      if (field && activeSortBtn) {
        const dir = activeSortBtn === "za" ? -1 : 1;
        filtered = [...filtered].sort((a, b) => {
          const aVal = field === "id" ? a[field] : (field === "licenseExpiry" || field === "lastInspection") ? new Date(a[field]) : a[field].toLowerCase();
          const bVal = field === "id" ? b[field] : (field === "licenseExpiry" || field === "lastInspection") ? new Date(b[field]) : b[field].toLowerCase();
          return aVal < bVal ? -dir : aVal > bVal ? dir : 0;
        });
      }

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody     = document.getElementById("tableBody");
      const noResults = document.getElementById("noResults");
      tbody.innerHTML = "";

      document.getElementById("resultsCount").textContent = `Showing ${data.length} of ${elevators.length} elevators`;

      if (data.length === 0) {
        noResults.classList.remove("hidden");
        return;
      }
      noResults.classList.add("hidden");

      data.forEach(e => {
        const statusClass    = statusColors[e.status] || "bg-gray-100 text-gray-500 ring-1 ring-gray-200";
        const licenseExpired = new Date(e.licenseExpiry) < new Date();
        const licenseClass   = licenseExpired ? "text-red-600 font-medium" : "text-gray-500";
        const inspectionClass = isOverdue(e.lastInspection) ? "text-red-600 font-medium" : "text-gray-500";
        const row = document.createElement("tr");
        row.className = "hover:bg-gray-50 transition-colors duration-75";
        row.innerHTML = `
          <td class="px-5 py-3 font-mono text-xs text-gray-600">${e.id}</td>
          <td class="px-5 py-3 text-sm text-gray-700">${e.location}</td>
          <td class="px-5 py-3 text-sm text-gray-500">${e.type}</td>
          <td class="px-5 py-3">
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium ${statusClass}">${e.status}</span>
          </td>
          <td class="px-5 py-3 text-sm font-mono ${licenseClass}">${e.licenseExpiry}</td>
          <td class="px-5 py-3 text-sm font-mono ${inspectionClass}">${e.lastInspection}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function filterTable() {
      applyFilters();
    }

    const activeElevators   = elevators.filter(e => e.status === "Active");
    const inactiveElevators = elevators.filter(e => e.status !== "Active");
    const overdueElevators  = elevators.filter(e => isOverdue(e.lastInspection));
    const expiredElevators  = elevators.filter(e => new Date(e.licenseExpiry) < new Date());

    document.getElementById("count-all").textContent      = elevators.length;
    document.getElementById("count-active").textContent   = activeElevators.length;
    document.getElementById("count-inactive").textContent = inactiveElevators.length;
    document.getElementById("count-overdue").textContent  = overdueElevators.length;
    document.getElementById("count-expired").textContent  = expiredElevators.length;

    document.getElementById("sub-all").textContent      = subData(elevators);
    document.getElementById("sub-active").textContent   = subData(activeElevators);
    document.getElementById("sub-inactive").textContent = nonActiveSubData(inactiveElevators);
    document.getElementById("sub-overdue").textContent  = subData(overdueElevators);
    document.getElementById("sub-expired").textContent  = subData(expiredElevators);

    renderTable(elevators);

    document.getElementById("headerDate").textContent =
      "Rocket Dashboard — " +
      new Date().toLocaleDateString("en-CA", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  </script>

</body>
</html>
