<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocket Elevators — Fleet Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.0"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen overflow-hidden antialiased">

  <!-- Sidebar -->
  <aside class="w-56 bg-gray-900 text-white flex flex-col flex-shrink-0 border-r border-white/5">
    <div class="px-5 py-5 border-b border-white/10">
      <span class="text-sm font-semibold tracking-tight text-white">Rocket Elevators</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-0.5">
      <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-lg bg-red-600 text-white text-sm font-medium">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Dashboard
      </a>
      <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-gray-400 text-sm hover:bg-white/5 hover:text-gray-200 transition-colors duration-100">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-6h13M9 11V5H3v6m6 6H3v-6m0 0h6"/></svg>
        Inspections
      </a>
      <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-gray-400 text-sm hover:bg-white/5 hover:text-gray-200 transition-colors duration-100">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Incidents
      </a>
      <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-gray-400 text-sm hover:bg-white/5 hover:text-gray-200 transition-colors duration-100">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"/></svg>
        Alterations
      </a>
    </nav>
    <div class="px-5 py-4 border-t border-white/10 text-xs text-gray-600 tracking-wide">
      v1.0 — Prototype
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto">

    <!-- Top Bar -->
    <header class="bg-white border-b border-gray-100 px-8 py-3.5 flex items-center justify-between sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <div>
          <h1 class="text-sm font-semibold text-gray-900 leading-tight">Fleet Overview</h1>
          <p id="headerDate" class="text-xs text-gray-400 leading-tight mt-0.5"></p>
        </div>
      </div>
      <div class="relative w-72">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 111 11a6 6 0 0116 0z"/></svg>
        <input
          id="searchInput"
          type="text"
          placeholder="Search by ID, location, type, or status…"
          class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-9 pr-3 py-1.5 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
          name="q"
          hx-get="/elevators"
          hx-trigger="input changed delay:300ms"
          hx-target="#tableBody"
          hx-swap="outerHTML"
          hx-include="#filters"
        />
      </div>
    </header>

    <div class="px-8 py-6 space-y-5">

      <!-- Summary Cards -->
      <div class="grid grid-cols-3 gap-4">

        <!-- Total Elevators — spans 2 rows -->
        <div id="card-all" onclick="selectCard('all')" class="cursor-pointer rounded-xl border border-blue-400 shadow-sm p-6 bg-blue-500 row-span-2 flex flex-col justify-between transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-all" class="text-xs font-semibold uppercase tracking-wide text-white/70">Total Elevators</p>
            <svg id="icon-all" class="w-5 h-5 text-white/60" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0H5m14 0h2M5 21H3M9 7h1m-1 4h1m4-4h1m-1 4h1M9 21v-4a2 2 0 012-2h2a2 2 0 012 2v4"/></svg>
          </div>
          <div>
            <p id="count-all" class="text-5xl font-bold tracking-tight text-white mt-2">{{ total }}</p>
            <p id="sub-all" class="text-xs text-white/50 mt-2 leading-relaxed"></p>
          </div>
        </div>

        <!-- Row 1 -->
        <div id="card-active" onclick="selectCard('active')" class="cursor-pointer rounded-xl border border-gray-100 shadow-sm p-5 bg-white transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-active" class="text-xs font-semibold uppercase tracking-wide text-gray-400">Active</p>
            <svg id="icon-active" class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <p id="count-active" class="text-3xl font-bold tracking-tight text-green-600 mt-3">{{ active }}</p>
          <p id="sub-active" class="text-xs text-gray-400 mt-1.5 leading-relaxed"></p>
        </div>

        <div id="card-inactive" onclick="selectCard('inactive')" class="cursor-pointer rounded-xl border border-gray-100 shadow-sm p-5 bg-white transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-inactive" class="text-xs font-semibold uppercase tracking-wide text-gray-400">Non-Active</p>
            <svg id="icon-inactive" class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <p id="count-inactive" class="text-3xl font-bold tracking-tight text-orange-500 mt-3">{{ inactive }}</p>
          <p id="sub-inactive" class="text-xs text-gray-400 mt-1.5 leading-relaxed"></p>
        </div>

        <!-- Row 2 -->
        <div id="card-overdue" onclick="selectCard('overdue')" class="cursor-pointer rounded-xl border border-gray-100 shadow-sm p-5 bg-white transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-overdue" class="text-xs font-semibold uppercase tracking-wide text-gray-400">Overdue Inspections</p>
            <svg id="icon-overdue" class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <p id="count-overdue" class="text-3xl font-bold tracking-tight text-red-600 mt-3">—</p>
          <p id="sub-overdue" class="text-xs text-gray-400 mt-1.5 leading-relaxed"></p>
        </div>

        <div id="card-expired" onclick="selectCard('expired')" class="cursor-pointer rounded-xl border border-gray-100 shadow-sm p-5 bg-white transition-all duration-150 hover:shadow-md">
          <div class="flex items-start justify-between">
            <p id="label-expired" class="text-xs font-semibold uppercase tracking-wide text-gray-400">Expired Licences</p>
            <svg id="icon-expired" class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
          </div>
          <p id="count-expired" class="text-3xl font-bold tracking-tight text-purple-600 mt-3">{{ expired }}</p>
          <p id="sub-expired" class="text-xs text-gray-400 mt-1.5 leading-relaxed"></p>
        </div>

      </div>

      <!-- Table Section -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100">

        <div class="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2.5">
            <h2 class="text-sm font-semibold text-gray-900">Elevator Details</h2>
            <span id="resultsCount" class="text-xs text-gray-400"></span>
          </div>
          <form id="filters"
              hx-get="/elevators"
              hx-target="#tableBody"
              hx-swap="outerHTML"
              hx-trigger="change">
            <input type="hidden" id="sort-field" name="sort" value="">
            <input type="hidden" id="sort-order" name="order" value="asc">
            <div class="flex items-center gap-2">
              <select name="status" class="border border-gray-200 rounded-lg px-3 py-1.5 text-xs text-gray-600 bg-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option value="All">All Statuses</option>
                {% for s in statuses %}<option>{{ s }}</option>{% endfor %}
              </select>
              <select name="city" class="border border-gray-200 rounded-lg px-3 py-1.5 text-xs text-gray-600 bg-white focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option value="All">All Cities</option>
                {% for c in cities %}<option>{{ c }}</option>{% endfor %}
              </select>
            </div>
          </form>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full" id="elevatorTable"
              hx-get="/elevators"
              hx-trigger="load"
              hx-target="#tableBody"
              hx-swap="outerHTML">
            <thead>
              <tr class="border-b border-gray-100">
                <th class="px-5 py-3 text-left">
                  <button id="sort-btn-elevator_id"
                      hx-get="/elevators"
                      hx-target="#tableBody"
                      hx-swap="outerHTML"
                      hx-include="#filters"
                      hx-vals='{"clicked_sort": "elevator_id"}'
                      class="flex items-center gap-1 text-xs font-semibold uppercase tracking-wide text-gray-400 hover:text-gray-600">
                    Elevator ID <span>↕</span>
                  </button>
                </th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">Location</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">Type</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">Status</th>
                <th class="px-5 py-3 text-left">
                  <button id="sort-btn-license_expiry"
                      hx-get="/elevators"
                      hx-target="#tableBody"
                      hx-swap="outerHTML"
                      hx-include="#filters"
                      hx-vals='{"clicked_sort": "license_expiry"}'
                      class="flex items-center gap-1 text-xs font-semibold uppercase tracking-wide text-gray-400 hover:text-gray-600">
                    License Expiry <span>↕</span>
                  </button>
                </th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-400">Last Inspection</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-50">
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  <script>
    const cardDefaults = {
      "card-all":      { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-gray-900",   icon: "text-gray-400"   },
      "card-active":   { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-green-600",  icon: "text-green-400"  },
      "card-inactive": { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-orange-500", icon: "text-orange-400" },
      "card-overdue":  { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-red-600",    icon: "text-red-400"    },
      "card-expired":  { label: "text-xs font-semibold uppercase tracking-wide text-gray-400", number: "text-purple-600", icon: "text-purple-400" },
    };

    const cardFilters = ["card-all", "card-active", "card-inactive", "card-overdue", "card-expired"];

    function selectCard(filter) {
      cardFilters.forEach(id => {
        const key        = id.replace("card-", "");
        const card       = document.getElementById(id);
        const labelEl    = document.getElementById(`label-${key}`);
        const countEl    = document.getElementById(`count-${key}`);
        const iconEl     = document.getElementById(`icon-${key}`);
        const subEl      = document.getElementById(`sub-${key}`);
        const def        = cardDefaults[id];
        const isSelected = id === `card-${filter}`;
        const isTotal    = id === "card-all";
        const extraClass = isTotal ? " row-span-2 flex flex-col justify-between" : "";
        const countSize  = isTotal ? "text-5xl" : "text-3xl";
        const subMt      = isTotal ? "mt-2" : "mt-1.5";

        if (isSelected) {
          card.className    = `cursor-pointer rounded-xl border border-blue-400 shadow-sm p-${isTotal ? "6" : "5"} bg-blue-500${extraClass} transition-all duration-150 hover:shadow-md`;
          labelEl.className = "text-xs font-semibold uppercase tracking-wide text-white/70";
          countEl.className = `${countSize} font-bold tracking-tight text-white mt-3`;
          iconEl.className  = "w-5 h-5 text-white/60";
          if (subEl) subEl.className = `text-xs text-white/50 ${subMt} leading-relaxed`;
        } else {
          card.className    = `cursor-pointer rounded-xl border border-gray-100 shadow-sm p-${isTotal ? "6" : "5"} bg-white${extraClass} transition-all duration-150 hover:shadow-md`;
          labelEl.className = def.label;
          countEl.className = `${countSize} font-bold tracking-tight ${def.number} mt-3`;
          iconEl.className  = `w-${isTotal ? "5" : "4"} h-${isTotal ? "5" : "4"} ${def.icon}`;
          if (subEl) subEl.className = `text-xs text-gray-400 ${subMt} leading-relaxed`;
        }
      });
    }

    document.getElementById("headerDate").textContent =
      "Rocket Dashboard — " +
      new Date().toLocaleDateString("en-CA", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  </script>

</body>
</html>
